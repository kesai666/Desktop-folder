name: cleanup-release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete premature release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
