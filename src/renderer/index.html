<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: file: blob:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>iOS Folder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root">
    <div class="mini glass" id="mini">
      <div class="wp" id="miniWp"></div>
      <div class="frost"></div>
      <div class="mini-grid" id="miniGrid"></div>
      <div class="mini-empty" id="miniEmpty" hidden>空</div>
    </div>
    <div class="mini-label" id="miniLabel"></div>

    <section class="panel glass" id="panel" aria-hidden="true">
      <div class="wp" id="panelWp"></div>
      <div class="frost panel-frost"></div>

      <div class="panel-inner">
        <header class="panel-head">
          <button class="back" id="backBtn" title="返回上一级" aria-label="返回" hidden>‹</button>
          <div class="title-wrap">
            <div class="title" id="title"></div>
            <div class="subtitle" id="subtitle"></div>
          </div>
          <input class="search" id="search" type="search" placeholder="搜索当前文件夹…" hidden />
          <button class="arrange" id="arrangeBtn" title="自由排列图标">排列</button>
          <button class="close" id="closeBtn" title="收起" aria-label="收起">×</button>
        </header>

        <div class="grid" id="grid" tabindex="-1"></div>

        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-icon"><span></span><span></span><span></span><span></span></div>
          <p class="empty-title">这个文件夹是空的</p>
          <p class="empty-sub">把文件拖进来，或右键 →「设置」换个文件夹</p>
        </div>

        <footer class="panel-foot">
          <span id="footCount"></span>
          <span class="foot-hint" id="footHint">双击打开 · 拖入放入 · 拖出移出</span>
        </footer>
      </div>

      <div class="drop-hint" id="dropHint">松手放入 · 移到这个文件夹</div>
      <div class="toast" id="toast" hidden></div>
    </section>
    <div class="marquee" id="marquee" hidden></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
